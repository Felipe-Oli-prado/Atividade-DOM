<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aprenda DOM Básicos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1 id="titulo">Manipulação do DOM</h1>

    <!-- Botões de Ação -->
    <div class="botoes">
      <button id="btn-hover">1. Hover</button>
      <button id="btn-delay">2. Delay (2s)</button>
      <button id="btn-texto">3. Alterar Texto</button>
      <button id="btn-classe">4. Alternar Classe</button>
      <button id="btn-add">5. Adicionar Item</button>
      <button id="btn-del">6. Remover Item</button>
    </div>

    <!-- Área de Resultado -->
    <div class="caixa">
      <p id="mensagem">Status: Aguardando ação...</p>
      <ul id="lista">
        <li>Item inicial</li>
      </ul>
    </div>
  </div>

  <script>
    // 1. Mapear os elementos
    const titulo = document.getElementById('titulo');
    const mensagem = document.getElementById('mensagem');
    const lista = document.getElementById('lista');

    // 2. Evento de Passar o Mouse (Hover)
    const btnHover = document.getElementById('btn-hover');
    btnHover.addEventListener('mouseenter', () => {
      btnHover.style.backgroundColor = '#86efac';
    });
    btnHover.addEventListener('mouseleave', () => {
      btnHover.style.backgroundColor = '';
    });

    // 3. Ação Assíncrona com Delay
    const btnDelay = document.getElementById('btn-delay');
    btnDelay.addEventListener('click', () => {
      mensagem.textContent = 'Processando... aguarde 2 segundos.';
      btnDelay.disabled = true;

      setTimeout(() => {
        mensagem.textContent = '✅ Ação concluída!';
        btnDelay.disabled = false;
      }, 2000);
    });

    // 4. Alterar Texto do Título
    document.getElementById('btn-texto').addEventListener('click', () => {
      titulo.textContent = 'Título Atualizado!';
    });

    // 5. Alternar Classe CSS
    document.getElementById('btn-classe').addEventListener('click', () => {
      mensagem.classList.toggle('destaque');
    });

    // 6. Adicionar Elemento na Lista
    document.getElementById('btn-add').addEventListener('click', () => {
      const novoItem = document.createElement('li');
      novoItem.textContent = `Novo Item (${lista.children.length + 1})`;
      lista.appendChild(novoItem);
    });

    // 7. Remover Elemento da Lista
    document.getElementById('btn-del').addEventListener('click', () => {
      if (lista.lastElementChild) {
        lista.lastElementChild.remove();
      }
    });
  </script>

</body>
</html>
